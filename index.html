<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva recomendación</title>
    <link rel="stylesheet" href="style.css">
    <!-- Configuración PWA para Celulares -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#color">
    <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

    <main class="contenedor">
        <section class="formulario">
            <h1>Nueva recomendación</h1>
            <p class="subtitulo">Compartí una película, serie, anime o juego que recomiendes.</p>

            <form action="#" method="post">

                <div class="campo">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo"
                           placeholder="Ej: Stranger Things" required>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo</label>
                    <select id="tipo" name="tipo" required>
                        <option value="">Seleccioná una opción</option>
                        <option value="pelicula">Película</option>
                        <option value="serie">Serie</option>
                        <option value="anime">Anime</option>
                        <option value="juego">Juego</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="genero">Género</label>
                    <select id="genero" name="genero" required>
                        <option value="">Seleccioná un género</option>
                        <option value="accion">Acción</option>
                        <option value="aventura">Aventura</option>
                        <option value="comedia">Comedia</option>
                        <option value="drama">Drama</option>
                        <option value="terror">Terror</option>
                        <option value="romance">Romance</option>
                        <option value="ciencia-ficcion">Ciencia ficción</option>
                        <option value="fantasia">Fantasía</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="resena">Reseña</label>
                    <textarea id="resena" name="resena"
                              placeholder="Escribí una breve reseña..." required></textarea>
                </div>

                <div class="fila">
                    <div class="campo">
                        <label for="fecha">Fecha</label>
                        <input type="date" id="fecha" name="fecha" required>
                    </div>

                    <div class="campo">
                        <label for="puntuacion">Puntuación</label>
                        <input type="number" id="puntuacion" name="puntuacion"
                               min="1" max="10" placeholder="1 - 10" required>
                    </div>
                </div>

                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario"
                           placeholder="Tu nombre de usuario" required>
                </div>

                <label class="checkbox">
                    <input type="checkbox" id="recomendada" name="recomendada" value="si">
                    <span>Recomiendo especialmente este contenido</span>
                </label>

                <button type="submit">Publicar recomendación</button>
            </form>
        </section>
    </main>

</body>
</html>
